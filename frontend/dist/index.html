<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FleetTracker</title>
    <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin />
    <script type="module" crossorigin src="/assets/index-BX6VbwZO.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/maplibre-BauRbC5E.js">
    <link rel="modulepreload" crossorigin href="/assets/deckgl-734shzEg.js">
    <link rel="stylesheet" crossorigin href="/assets/index-EpmbJGpL.css">
  </head>
  <body>
    <!-- Fullscreen map container -->
    <div id="map"></div>

    <!-- HUD badges (top-left) -->
    <div id="hud">
      <div class="hud-badge" id="hud-features">
        features: <strong>0</strong>
      </div>
    </div>

    <!-- ================================================================= -->
    <!-- Top-center toolbar                                                 -->
    <!-- ================================================================= -->
    <div id="toolbar" class="toolbar">
      <button class="toolbar__btn" id="tb-filters" data-panel="filters" title="Filters (left)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>
        </svg>
      </button>
      <button class="toolbar__btn" id="tb-search" data-panel="search" title="Search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </button>
      <button class="toolbar__btn" id="tb-layers" data-panel="layers" title="Layers (right)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/>
          <path d="M2 17l10 5 10-5"/>
          <path d="M2 12l10 5 10-5"/>
        </svg>
      </button>
    </div>

    <!-- ================================================================= -->
    <!-- NOTCH MENUS – HIDDEN, KEPT FOR FUTURE REUSE                        -->
    <!-- ================================================================= -->

    <!-- Left-side filter panel notch (hidden) -->
    <div id="filter-notch" class="filter-notch" title="Toggle filters" style="display:none">
      <svg class="filter-notch__arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="9 18 15 12 9 6" />
      </svg>
    </div>

    <!-- Right-side panel notch (hidden) -->
    <div id="panel-notch" class="panel-notch" title="Toggle panel" style="display:none">
      <svg class="panel-notch__arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="15 18 9 12 15 6" />
      </svg>
    </div>

    <!-- ================================================================= -->
    <!-- Left-side filter panel                                             -->
    <!-- ================================================================= -->
    <div id="filter-panel" class="filter-panel">
      <div class="fp-header">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14" class="fp-header-icon">
          <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>
        </svg>
        <span class="fp-header__title">Filters</span>
        <span class="fp-header__count" id="fp-count">0</span>
        <button class="fp-header__close" id="fp-close" title="Close panel">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
        <button class="fp-header__clear" id="fp-clear" title="Clear all filters">Clear</button>
      </div>
      <div class="fp-body" id="fp-body"></div>
    </div>

    <!-- ================================================================= -->
    <!-- Right-side panel (Layers / Tiles / Data)                          -->
    <!-- ================================================================= -->
    <div id="side-panel" class="side-panel">
      <div class="sp-panel-header">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14" class="sp-panel-header__icon">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
        </svg>
        <span class="sp-panel-header__title">Layers</span>
        <button class="sp-panel-header__close" id="sp-close" title="Close panel">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <!-- Section 1: Layers -->
      <div class="sp-section" data-section="layers">
        <div class="sp-section__header" data-toggle="layers">
          <span class="sp-section__title">Layers</span>
          <span class="sp-section__count" id="sp-layers-count">0</span>
          <svg class="sp-section__chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
        <div class="sp-section__body" id="sp-layers-body"></div>
      </div>

      <!-- Section 2: Tiles -->
      <div class="sp-section" data-section="tiles">
        <div class="sp-section__header" data-toggle="tiles">
          <span class="sp-section__title">Tiles</span>
          <span class="sp-section__count" id="sp-tiles-count">0</span>
          <svg class="sp-section__chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
        <div class="sp-section__body" id="sp-tiles-body"></div>
      </div>

      <!-- Section 3: Data -->
      <div class="sp-section" data-section="data">
        <div class="sp-section__header" data-toggle="data">
          <span class="sp-section__title">Data</span>
          <span class="sp-section__count" id="sp-data-count">0</span>
          <svg class="sp-section__chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
        <div class="sp-section__body" id="sp-data-body"></div>
      </div>
    </div>

    <!-- ================================================================= -->
    <!-- Search panel (right side)                                         -->
    <!-- ================================================================= -->
    <div id="search-panel" class="search-panel">
      <div class="search-panel__header">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14" class="search-panel__icon">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <span class="search-panel__title">Search</span>
        <button class="search-panel__close" id="search-close" title="Close panel">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="search-panel__body" id="search-body">
        <input type="text" class="search-panel__input fp-input" id="search-input" placeholder="Search features, layers..." />
        <div id="search-results" class="search-panel__results"></div>
      </div>
    </div>

    <!-- ================================================================= -->
    <!-- Persistent feature tooltip (click-to-inspect)                     -->
    <!-- ================================================================= -->
    <div id="feature-tooltip" class="feature-tooltip"></div>

    <!-- ================================================================= -->
    <!-- Settings modal (per-index attribute config)                       -->
    <!-- ================================================================= -->
    <div id="settings-overlay" class="settings-overlay" style="display:none">
      <div class="settings-modal">
        <div class="settings-modal__header">
          <span class="settings-modal__title" id="settings-title">Settings</span>
          <button class="settings-modal__close" id="settings-close" title="Close">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
              <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
        <div class="settings-modal__body" id="settings-body"></div>
      </div>
    </div>

    <!-- Live coordinates (bottom-right) -->
    <div id="coords" class="coords-badge">
      <span id="coords-lat">0.0000</span>, <span id="coords-lng">0.0000</span>
    </div>

    <!-- Hover tooltip (follows cursor) -->
    <div id="tooltip"></div>

  </body>
</html>
